<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Validated Apache Wayang JDBC flow</title>
  <desc id="desc">A validated flow from JDBC Application to Driver, Protocol, Server, Wayang, and Results.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .box { fill: #ffffff; stroke: #2f6f9f; stroke-width: 2; rx: 18; }
      .text { fill: #1f2933; font: 600 26px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .subtext { fill: #52616f; font: 500 18px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .arrow { stroke: #6b879f; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .checkCircle { fill: #e7f6ee; stroke: #17844f; stroke-width: 2; }
      .check { fill: none; stroke: #17844f; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .badge { fill: #eaf4fb; stroke: #2f6f9f; stroke-width: 1.5; rx: 14; }
      .badgeText { fill: #2f6f9f; font: 700 17px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0.04em; }
    </style>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b879f" />
    </marker>
  </defs>

  <rect class="bg" width="1200" height="360" rx="28" />

  <rect class="badge" x="455" y="34" width="290" height="42" />
  <text class="badgeText" x="600" y="61" text-anchor="middle">VALIDATED END-TO-END FLOW</text>

  <g transform="translate(55 125)">
    <rect class="box" width="155" height="90" />
    <text class="text" x="77.5" y="43" text-anchor="middle">JDBC</text>
    <text class="subtext" x="77.5" y="68" text-anchor="middle">Application</text>
    <circle class="checkCircle" cx="132" cy="17" r="15" />
    <path class="check" d="M124 17 l5 5 l10 -12" />
  </g>

  <path class="arrow" d="M225 170 H300" marker-end="url(#arrowhead)" />

  <g transform="translate(315 125)">
    <rect class="box" width="140" height="90" />
    <text class="text" x="70" y="55" text-anchor="middle">Driver</text>
    <circle class="checkCircle" cx="117" cy="17" r="15" />
    <path class="check" d="M109 17 l5 5 l10 -12" />
  </g>

  <path class="arrow" d="M470 170 H545" marker-end="url(#arrowhead)" />

  <g transform="translate(560 125)">
    <rect class="box" width="150" height="90" />
    <text class="text" x="75" y="55" text-anchor="middle">Protocol</text>
    <circle class="checkCircle" cx="127" cy="17" r="15" />
    <path class="check" d="M119 17 l5 5 l10 -12" />
  </g>

  <path class="arrow" d="M725 170 H800" marker-end="url(#arrowhead)" />

  <g transform="translate(815 125)">
    <rect class="box" width="140" height="90" />
    <text class="text" x="70" y="55" text-anchor="middle">Server</text>
    <circle class="checkCircle" cx="117" cy="17" r="15" />
    <path class="check" d="M109 17 l5 5 l10 -12" />
  </g>

  <path class="arrow" d="M970 170 H1045" marker-end="url(#arrowhead)" />

  <g transform="translate(1060 125)">
    <rect class="box" width="110" height="90" />
    <text class="text" x="55" y="43" text-anchor="middle">Wayang</text>
    <text class="subtext" x="55" y="68" text-anchor="middle">Results</text>
    <circle class="checkCircle" cx="87" cy="17" r="15" />
    <path class="check" d="M79 17 l5 5 l10 -12" />
  </g>

  <text class="subtext" x="600" y="285" text-anchor="middle">Driver behavior · Protocol handling · Server execution · Metadata · Errors · Resource lifecycle</text>
</svg>
